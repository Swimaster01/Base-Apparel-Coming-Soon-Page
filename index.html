<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="card">
            <section class="hero-img">
                <img src="images/hero-desktop.webp" alt="">
            </section>
            <section class="hero">
                <section class="logo">
                    <img src="/images/logo.svg" alt="">

                </section>
                <section class="content">
                    <section class="heading">
                        <h1> WE'RE </h1>
                        <h2> COMING SOON </h2>
                    </section>
                    <section class="para">
                        <p> Hello fellow shoppers! We're currently building our new fashion store. Add your email below to stay upto-date with announcements and our launch deals </p>
                    </section>

                    <section class="form">
                        <form class="sub-form" action="#" method="post">
                            <input type="email" class="email-input" placeholder="Email Address" required>
                            <button type="submit" class="sub-button" aria-label="submit">
                                <img src="images/icon-arrow.svg" alt="">
                            </button>
                        </form>
                    </section>

                </section>

            </section>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
